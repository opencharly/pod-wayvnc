wayvnc:
    candy:
        description: |
            WayVNC headless VNC server exposing a wlroots Wayland desktop on TCP 5900
            Installs the wayvnc package (the /usr/bin/wayvnc server) plus a
            launcher wrapper under ~/.local/bin, run as a supervised service that
            publishes the Wayland desktop over VNC on port 5900. Verifiable: the
            server binary and wrapper exist and the package is installed at build
            scope; at deploy scope the wayvnc service runs and the VNC port
            accepts a TCP connection.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        port:
            - tcp:5900
        distro:
            # `arch` also covers CachyOS (its distro tags are [cachyos, arch]).
            # Arch ships the latest upstream wayvnc (0.10.2 as of 2026-11).
            arch:
                package:
                    - wayvnc
            fedora:
                package:
                    - wayvnc
        service:
            - name: wayvnc
              exec: "%(ENV_HOME)s/.local/bin/wayvnc-wrapper"
              env:
                WAYLAND_DISPLAY: wayland-0
                XDG_RUNTIME_DIR: /tmp
              restart: always
              priority: 20
              start_sec: 0
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=wayvnc-wrapper
              copy: wayvnc-wrapper
              to: "${HOME}/.local/bin/wayvnc-wrapper"
              mode: "0755"
              run_as: "${USER}"
            - check: the wayvnc server binary is installed at /usr/bin/wayvnc
              file:
                file: /usr/bin/wayvnc
                exists: true
            - check: the wrapper serves whichever output it is told (WAYVNC_OUTPUT) instead of hard-coding HEADLESS-1, and gates the power-on workaround to wayvnc <= 0.9.1
              id: wayvnc-wrapper-generic
              file:
                file: ${HOME}/.local/bin/wayvnc-wrapper
                contains:
                    - contains: 'WAYVNC_ARGS="$WAYVNC_ARGS -o $WAYVNC_OUTPUT"'
                    - contains: "wayvnc_needs_power_on"
                    - not_contains: "-o HEADLESS-1"
            - check: the installed wrapper's version gate runs the power-on workaround for wayvnc <= 0.9.1 and an unparseable version, and skips it from 0.10 on (executed against fake wayvnc --version outputs)
              id: wayvnc-power-on-gate
              exit_status: 0
              stdout:
                  - contains: "wayvnc: 0.9.1=needs"
                  - contains: "wayvnc: v0.8.0=needs"
                  - contains: "wayvnc: 0.10.2=skip"
                  - contains: "wayvnc 0.10.1=skip"
                  - contains: "garbage=needs"
              command: |
                f=$(mktemp)
                sed -n '/^wayvnc_needs_power_on() {/,/^}/p' ${HOME}/.local/bin/wayvnc-wrapper > "$f"
                for v in "wayvnc: 0.9.1" "wayvnc: v0.8.0" "wayvnc: 0.10.2" "wayvnc 0.10.1" "garbage"; do
                  if sh -c ". \"$f\"; wayvnc() { echo \"$v\"; }; wayvnc_needs_power_on"; then printf '%s=needs\n' "$v"; else printf '%s=skip\n' "$v"; fi
                done
                rm -f "$f"
            - check: the wayvnc launcher wrapper is installed and executable
              file:
                file: ${HOME}/.local/bin/wayvnc-wrapper
                exists: true
                mode: "0755"
            - check: the supervised wayvnc service is running
              context:
                - runtime
              service:
                service: wayvnc
                running: true
            - check: the VNC port accepts a TCP connection on the published host port
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:5900}
                reachable: true
            - check: package=wayvnc
              id: wayvnc-package
              package:
                package: wayvnc
                installed: true
            - check: addr=127.0.0.1:${HOST_PORT:5900}
              id: wayvnc-port-reachable
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:5900}
                reachable: true

wayvnc-skill:
    skill:
        name: wayvnc
        family: selkies
        owner: wayvnc
        description: |-
            WayVNC server on port tcp:5900 for remote access to Wayland desktops.
            Use when working with VNC access, remote desktop, or wayvnc configuration.
